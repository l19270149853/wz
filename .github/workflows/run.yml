name: 自动更新直播源

on:
  schedule:
    - cron: '0 2 * * *'   # 每天凌晨2点运行（可改）
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 赋予推送权限

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，以便 rebase

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（如需）
        run: |
          pip install requests  # 替换为你的实际依赖

      - name: 运行更新脚本
        run: tv_sort.py   # 替换为你的脚本文件名

      - name: 配置 Git 用户
        run: |
          git config user.name "l19270149853"
          git config user.email "362213335lkh@gmail.com"

      - name: 提交更改
        run: |
          git add .
          # 如果有更改才提交，否则跳过
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
            exit 0
          fi
          git commit -m "自动更新直播源 $(date +'%Y-%m-%d')"

      - name: 拉取远程最新（rebase）并推送
        run: |
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
